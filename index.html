<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spearfisher - SAE 4.02</title>
  <link rel="stylesheet" href="src/styles/style.css">

  <!-- Importation d'A-Frame et des extensions nécessaires -->

  <script src="src/utils/compatibility-shims.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

  <!-- Importation des composants -->
  <script src="src/components/water-effect.js"></script>
  <script src="src/components/water-adapter.js"></script>
  <script src="src/components/grab-manager.js"></script>
  <script src="src/components/spear-bounce.js"></script>
  <script src="src/components/bubble-spawner.js"></script>
  <script src="src/components/fish-rotator.js"></script>
  <script src="src/components/coral-placer.js"></script>
  <script src="src/components/panel-placer.js"></script>
  <script src="src/components/look-at-camera.js"></script>
  <script src="src/components/fish-spawner.js"></script>
  <script src="src/components/room-detection.js"></script>
  <script src="src/systems/game-timer.js"></script>
  <script src="src/systems/game-manager.js"></script>
</head>

<body>
  <!-- Page de chargement / Landing Page -->
  <div id="landing-page">
    <div class="landing-bg"></div>
    <div class="landing-overlay"></div>
    
    <!-- Effets de bulles animées -->
    <div class="bubbles-container"></div>
    
    
    <div class="landing-content">
      <!-- Logo Spear Fisher -->
      <div class="landing-logo">
        <img src="assets/images/logo.png" alt="Spear Fisher Logo">
      </div>

      <!-- Boutons d'entrée -->
      <div class="landing-buttons">
        <button id="play-btn" class="landing-btn btn-primary">
          <span class="btn-shine"></span>
          <span class="btn-text">PLAY</span>
          <span class="btn-glow"></span>
        </button>
     
        <button id="quit-btn" class="landing-btn btn-secondary">
          <span class="btn-shine"></span>
          <span class="btn-text">QUIT</span>
          <span class="btn-glow"></span>
        </button>
      </div>

     
      
      <!-- Version -->
      <div class="version">v1.01</div>
      
      <!-- Réseaux sociaux -->

          </svg>
        </a>
        <a href="#" class="social-link" title="Twitter">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/>

        </a>
      </div>

       <!-- Footer et version -->
      <div class="landing-footer">
        <p class="copyright">Copyright 2026 - HyperBerry Games</p>
      </div>
    </div>
  </div>

  <!-- Chronomètre en jeu (HTML overlay pour PC) -->
  <div id="timer-display" style="display:none;">1:00</div>
  
  <!-- Bouton High Scores -->
  <button id="high-scores-btn" class="high-scores-button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="white"/>
    </svg>
    <span>Find here your<br>high score history</span>
  </button>

  <!-- Panneau des meilleurs scores -->
  <div id="high-scores-panel" class="high-scores-panel">
    <div class="high-scores-container">
      <button class="close-btn" id="close-high-scores">✕</button>
      <h2>🏆 Voici vos 3 meilleures sessions</h2>
      <div id="high-scores-list" class="scores-list"></div>
    </div>
  </div>

  <!-- End game HTML overlay (shown when time ends or all fishes are caught) -->
  <div id="end-game-screen">
    <div class="end-game-container">
      <div class="end-game-header">
        <h1>Game Over</h1>
        <h2 id="end-subtitle">Summary</h2>
      </div>

      <div class="score-table-wrapper">
        <table id="score-table">
          <thead><tr><th>Fish</th><th>Quantity</th><th>Points</th></tr></thead>
          <tbody id="score-table-body"></tbody>
        </table>
      </div>

      <div class="end-game-buttons">
        <button class="btn-end btn-restart" id="btn-restart">Play Again</button>
        <button class="btn-end btn-quit" id="btn-quit">Quit</button>
      </div>
    </div>
  </div>

  <!-- Scène A-Frame avec configuration WebXR native pour AR -->
  <a-scene webxr="referenceSpaceType: local-floor; overlayElement: #ar-overlay; requiredFeatures: local-floor, hit-test, plane-detection, mesh-detection; optionalFeatures: depth-sensing, anchors;" room-detection="enableTest: true"
    grab-manager
    physics="gravity: 0"
    fog="type: exponential; color: #001a33; density: 0.02"
    renderer="colorManagement: true; alpha: true; antialias: true; sortTransparentObjects: true">

    <a-assets>
      <a-asset-item id="spear-model" src="assets/models/stylized_low-poly_spear.glb"></a-asset-item>
      <a-asset-item id="goldfish" src="assets/models/Goldfish.glb"></a-asset-item>
      <a-asset-item id="piranha" src="assets/models/Piranha.glb"></a-asset-item>
      <a-asset-item id="thon" src="assets/models/thon.glb"></a-asset-item>
      <a-asset-item id="thon_bleu" src="assets/models/thon_bleu.glb"></a-asset-item>
      <a-asset-item id="starfish" src="assets/models/Starfish.glb"></a-asset-item>
      <!-- Environment decoration models -->
      <a-asset-item id="coral-red" src="assets/models/Coral-red.glb"></a-asset-item>
      <a-asset-item id="grass" src="assets/models/Grass.glb"></a-asset-item>
      <a-asset-item id="rock" src="assets/models/Rock.glb"></a-asset-item>
      <a-asset-item id="rocks" src="assets/models/Rocks.glb"></a-asset-item>
      <a-asset-item id="vine" src="assets/models/Vine.glb"></a-asset-item>
      <a-asset-item id="underwater-coral" src="assets/models/underwater_enviro_coral.glb"></a-asset-item>
      <!-- Sound effects -->
      <audio id="spear-thrust-1" src="assets/son/yodguard-spear_thrust-1-382402.mp3" preload="auto"></audio>
      <audio id="spear-thrust-2" src="assets/son/yodguard-spear_thrust-2-382404.mp3" preload="auto"></audio>
      <audio id="spear-thrust-3" src="assets/son/yodguard-spear_thrust-3-382407.mp3" preload="auto"></audio>
      <audio id="clock-ticking" src="assets/son/reddog0607-clock-ticking-365218.mp3" preload="auto"></audio>
      <audio id="underwater-loop" src="assets/son/freesound_community-underwater-loop-amb-6182.mp3" preload="auto" loop></audio>
      <audio id="win-sound-1" src="assets/son/floraphonic-you-win-sequence-1-183948.mp3" preload="auto"></audio>
      <audio id="win-sound-2" src="assets/son/floraphonic-you-win-sequence-2-183949.mp3" preload="auto"></audio>
      <audio id="button-press" src="assets/son/dragon-studio-button-press-382713.mp3" preload="auto"></audio>
      <audio id="explosion" src="assets/son/daviddumaisaudio-large-underwater-explosion-190270.mp3" preload="auto"></audio>
      <audio id="ocean-wave" src="assets/son/freesound_community-ocean-wave-100271.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Ancre monde : tous les objets 3D sont enfants de cette entité pour rester fixes dans l'espace réel -->
    <a-entity id="world-anchor" fish-spawner="count: 12">

    <!-- Camera HUD: bonus target, score and 3D timer -->
    <a-entity id="cameraRig">
      <a-camera id="head" look-controls>
        <!-- Cursor for mouse (desktop) and gaze interactions -->
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable" position="0 0 -1"></a-entity>
        
        <!-- Viseur de visée (crosshair) -->
        <a-entity id="crosshair" position="0 0 -1.2">
          <!-- Centre du viseur -->
          <a-ring color="#00ff00" radius-inner="0.002" radius-outer="0.004" material="opacity: 0.8"></a-ring>
          <!-- Lignes du viseur -->
          <a-box color="#00ff00" width="0.015" height="0.002" depth="0.001" position="0 0.01 0" material="opacity: 0.7"></a-box>
          <a-box color="#00ff00" width="0.015" height="0.002" depth="0.001" position="0 -0.01 0" material="opacity: 0.7"></a-box>
          <a-box color="#00ff00" width="0.002" height="0.015" depth="0.001" position="0.01 0 0" material="opacity: 0.7"></a-box>
          <a-box color="#00ff00" width="0.002" height="0.015" depth="0.001" position="-0.01 0 0" material="opacity: 0.7"></a-box>
        </a-entity>
        
        <a-entity id="bonus-fish" position="-0.15 0.2 -0.7" scale="0.8 0.8 0.8" visible="false">
          <a-plane color="#1a1a1a" opacity="0.9" width="0.38" height="0.28" position="0 0 -0.015"></a-plane>
          <a-box color="#FFD700" width="0.38" height="0.015" depth="0.01" position="0 0.14 0" material="metalness: 0.8; roughness: 0.2"></a-box>
          <a-box color="#FFD700" width="0.38" height="0.015" depth="0.01" position="0 -0.14 0" material="metalness: 0.8; roughness: 0.2"></a-box>
          <a-entity position="0 0 0.03">
            <a-entity id="fish-3d" gltf-model="#goldfish" position="0.05 0.02 0" rotation="0 90 0" scale="0.004 0.004 0.004" fish-rotator="interval: 8000"></a-entity>
            <a-text value="TARGET" align="center" color="#FFD700" width="0.8" position="0.02 -0.08 0.01" font="roboto"></a-text>
          </a-entity>
        </a-entity>

        <a-text id="score-display" value="Fish: 0" position="-0.15 0.0 -0.7" align="center" color="#FFD700" width="0.6" font="roboto" shader="msdf" visible="false"></a-text>

        <a-entity id="timer-3d" position="0.25 0.25 -0.7" scale="0.6 0.6 0.6" visible="false">
          <a-plane color="#000000" opacity="0.8" width="0.25" height="0.12" position="0 0 -0.01"></a-plane>
          <a-text id="timer-text" value="1:00" align="center" color="#FFD700" width="0.8" position="0 0 0"></a-text>
        </a-entity>

        <!-- Start button for VR (3D) - hidden until room scan completes -->
        <a-entity id="start-button-3d" class="clickable" position="0 -0.1 -0.7" visible="false">
          <a-box class="clickable" color="#3498db" width="0.45" height="0.12" depth="0.03">
            <a-text value="▶ PLAY" align="center" anchor="center" baseline="center" color="#ffffff" width="1.2" position="0 0 0.02"></a-text>
          </a-box>
        </a-entity>

        <!-- High Scores button for VR (3D) - hidden until room scan completes -->
        <a-entity id="high-scores-btn-3d" class="clickable" position="0 -0.25 -0.7" visible="false">
          <a-box class="clickable" color="#4a90e2" width="0.55" height="0.1" depth="0.03">
            <a-text value="🏆 HIGH SCORES" align="center" anchor="center" baseline="center" color="#ffffff" width="1.2" position="0 0 0.02"></a-text>
          </a-box>
        </a-entity>

        <!-- High Scores Panel 3D (visible when clicking the button) -->
        <a-entity id="high-scores-panel-3d" position="0 0 -1.0" visible="false">
          <!-- Fond du panneau -->
          <a-plane color="#16213e" opacity="0.95" width="0.9" height="0.8" position="0 0 -0.02" material="shader: flat"></a-plane>
          <!-- Bordure bleue -->
          <a-box color="#4a90e2" width="0.9" height="0.02" depth="0.01" position="0 0.4 0"></a-box>
          <a-box color="#4a90e2" width="0.9" height="0.02" depth="0.01" position="0 -0.4 0"></a-box>
          <a-box color="#4a90e2" width="0.02" height="0.8" depth="0.01" position="-0.45 0 0"></a-box>
          <a-box color="#4a90e2" width="0.02" height="0.8" depth="0.01" position="0.45 0 0"></a-box>
          <!-- Titre -->
          <a-text value="🏆 Vos 3 meilleures sessions" align="center" color="#4a90e2" width="1.5" position="0 0.32 0.01"></a-text>
          <!-- Liste des scores (remplie dynamiquement) -->
          <a-entity id="high-scores-list-3d" position="0 0.05 0.01"></a-entity>
          <!-- Bouton fermer -->
          <a-entity id="close-high-scores-3d" class="clickable" position="0 -0.3 0.01">
            <a-box class="clickable" color="#e74c3c" width="0.25" height="0.08" depth="0.02">
              <a-text value="FERMER" align="center" anchor="center" baseline="center" color="#ffffff" width="1" position="0 0 0.015"></a-text>
            </a-box>
          </a-entity>
        </a-entity>

        <!-- Reset spear buttons removed -->

        <!-- Écran de fin de jeu en 3D (copie depuis la branche score-challenge) -->
        <a-entity id="end-screen-3d" position="0 0 -1.5" visible="false">
          <!-- Fond du panneau -->
          <a-plane color="#1a1a2e" opacity="0.95" width="1.2" height="1.6" position="0 0 -0.02" material="shader: flat"></a-plane>
          <!-- Bordure dorée -->
          <a-box color="#FFD700" width="1.2" height="0.02" depth="0.01" position="0 0.8 0"></a-box>
          <a-box color="#FFD700" width="1.2" height="0.02" depth="0.01" position="0 -0.8 0"></a-box>
          <a-box color="#FFD700" width="0.02" height="1.6" depth="0.01" position="-0.6 0 0"></a-box>
          <a-box color="#FFD700" width="0.02" height="1.6" depth="0.01" position="0.6 0 0"></a-box>

          <!-- Titre -->
          <a-text value="🎣 FIN DE LA PARTIE 🎣" align="center" color="#FFD700" width="1.8" position="0 0.65 0"></a-text>
          <a-text value="Poissons attrapés" align="center" color="#FFD700" width="1.5" position="0 0.52 0"></a-text>

          <!-- Le tableau sera généré dynamiquement ici par populateScoreTable3D() -->
          <a-entity id="dynamic-score-table-3d" position="0 0 0.01"></a-entity>

          <!-- Boutons interactifs avec animations hover -->
          <a-box id="btn-restart-3d" class="clickable" color="#FFD700" width="0.45" height="0.12" depth="0.03" position="-0.25 -0.65 0.02"
                 animation__hover="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
                 animation__leave="property: scale; from: 1.1 1.1 1.1; to: 1 1 1; startEvents: mouseleave; dur: 200">
            <a-text value="🔄 REJOUER" align="center" color="#000000" width="1.2" position="0 0 0.02"></a-text>
          </a-box>

          <a-box id="btn-quit-3d" class="clickable" color="#e74c3c" width="0.45" height="0.12" depth="0.03" position="0.25 -0.65 0.02"
                 animation__hover="property: scale; from: 1 1 1; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
                 animation__leave="property: scale; from: 1.1 1.1 1.1; to: 1 1 1; startEvents: mouseleave; dur: 200">
            <a-text value="❌ QUITTER" align="center" color="#ffffff" width="1.2" position="0 0 0.02"></a-text>
          </a-box>
        </a-entity>

      </a-camera>
    </a-entity>

    <!-- Ground for physics collisions -->
    <a-entity id="ground" geometry="primitive: plane; width: 20; height: 20" rotation="-90 0 0" position="0 0 0" visible="false" static-body></a-entity>
      <!-- Les poissons seront générés automatiquement par fish-spawner après le scan de la pièce -->

      <!-- Lumières -->
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="1 2 1"></a-light>
      <!-- Lumière bleutée sous l'eau -->
      <a-light type="point" color="#0088ff" intensity="0.5" position="0 0.5 -2"></a-light>

      <!-- Spear model (replace the blue cube) - grabbable -->
      <a-entity id="spear" weapon position="0 1.45 -0.6" rotation="0 90 0" 
        class="weapon"
        geometry="primitive: box; width: 0.05; height: 0.05; depth: 0.6" 
        material="color: #ff0000; opacity: 0.3; transparent: true"
        gltf-model="#spear-model"
        scale="0.5 0.5 0.5"
        dynamic-body="mass:1; shape:sphere; sphereRadius:0.18"
        spear-bounce="restitution:0.5; damping:0.7">
      </a-entity>

      <!-- Les poissons seront générés automatiquement par fish-spawner après le scan de la pièce -->

      <!-- Bubble spawner: spawn intermittently under water inside the detected room -->
      <a-entity id="bubble-spawner" bubble-spawner></a-entity>

      <!-- Coral placer: place coral models on yellow visuals and on the floor after scan -->
      <a-entity id="coral-placer" coral-placer></a-entity>

      <!-- Panel placer: optionally place UI panels on detected walls (disabled by default) -->
      <a-entity id="panel-placer" panel-placer="enabled: false"></a-entity>

    </a-entity>

    <!-- VR Hands with laser controls and raycasters to interact with 3D UI -->
    <a-entity id="leftHand" hand-controls="hand: left; handModelStyle: lowPoly; color: #15ACCF" laser-controls="hand: left" raycaster="objects: .clickable" visible="true"></a-entity>
    <a-entity id="rightHand" hand-controls="hand: right; handModelStyle: lowPoly; color: #15ACCF" laser-controls="hand: right" raycaster="objects: .clickable" visible="true"></a-entity>

    <!-- EFFET D'EAU QUI MONTE avec shader Three.js (positionnée dans le monde, pas au niveau de la caméra) -->
    <a-entity id="water-surface" position="0 0 -2" water-adapter>

      <!-- Surface d'eau avec effet de vagues fluides (couche principale bleu profond) -->
      <a-entity id="water-fluid"
        visible="false"
        water-shader="color: #004b7f; opacity: 0.75; speed: 1.5; waveHeight: 0.08; waveFrequency: 1.5">
      </a-entity>

      <!-- Deuxième couche d'eau plus claire pour la profondeur -->
      <a-entity position="0 -0.05 0" visible="false"
        water-shader="color: #006fb3; opacity: 0.35; speed: 0.8; waveHeight: 0.05; waveFrequency: 2.0">
      </a-entity>
    </a-entity>

    <!-- (moved bubble-spawner into world-anchor) -->

  </a-scene>

  <script src="src/systems/game-manager.js"></script>
  <script>
    // Création dynamique des bulles pour un effet plus riche
    (function() {
      const bubblesContainer = document.querySelector('.bubbles-container');
      if (!bubblesContainer) return;
      
      function createBubble() {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.style.cssText = `
          position: absolute;
          bottom: -100px;
          left: ${Math.random() * 100}%;
          width: ${Math.random() * 30 + 10}px;
          height: ${Math.random() * 30 + 10}px;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
          border-radius: 50%;
          animation: bubbleRise ${Math.random() * 6 + 8}s ease-in forwards;
          animation-delay: ${Math.random() * 5}s;
          pointer-events: none;
        `;
        bubblesContainer.appendChild(bubble);
        
        // Supprimer la bulle après l'animation
        setTimeout(() => {
          if (bubble.parentNode) {
            bubble.parentNode.removeChild(bubble);
          }
        }, (Math.random() * 6 + 8 + Math.random() * 5) * 1000);
      }
      
      // Créer plusieurs bulles au démarrage
      for (let i = 0; i < 15; i++) {
        setTimeout(createBubble, i * 500);
      }
      
      // Continuer à créer des bulles
      setInterval(createBubble, 1500);
    })();

    // Landing page handlers
    (function () {
      const landingPage = document.getElementById('landing-page');
      const playBtn = document.getElementById('play-btn')
      const quitBtn = document.getElementById('quit-btn');
      const scene = document.querySelector('a-scene');

      // Cacher la scène initialement
      if (scene) scene.style.display = 'none';

      // Fonction pour démarrer le jeu
      function startGame() {
        // Cacher la landing page avec animation
        if (landingPage) {
          landingPage.style.opacity = '0';
          setTimeout(() => {
            landingPage.style.display = 'none';
            // Afficher la scène
            if (scene) scene.style.display = 'block';
            
            // Lancer WebXR après un court délai
            setTimeout(() => {
              // Déclencher l'entrée en mode AR/XR
              if (scene.xrSession) {
                scene.xrSession.end();
              } else {
                scene.enterAR();
              }
            }, 500);
          }, 300);
        }
      }

      // Bouton PLAY - Lance le jeu en XR
      if (playBtn) {
        playBtn.addEventListener('click', () => startGame());
      }

      // Bouton QUIT - Fermer l'application
      if (quitBtn) {
        quitBtn.addEventListener('click', () => {
          window.close();
        });
      }
    })();

    // End-game overlay buttons
    (function () {
      const restart = document.getElementById('btn-restart');
      const quit = document.getElementById('btn-quit');
      const endScreen = document.getElementById('end-game-screen');
      if (restart) restart.addEventListener('click', () => {
        try {
          if (window.gameTimer && window.gameTimer.resetGame) window.gameTimer.resetGame();
          // small delay then start a fresh game (default 60s)
          setTimeout(() => { try { if (window.gameTimer && window.gameTimer.startGame) window.gameTimer.startGame(60); } catch(e){} }, 200);
        } catch (e) { console.warn('restart click error', e); }
      });
      if (quit) quit.addEventListener('click', () => {
        try {
          if (window.gameTimer && window.gameTimer.resetGame) window.gameTimer.resetGame();
        } catch (e) {}
        // Reload page as a simple quit action to return to the launcher state
        try { window.location.reload(); } catch (e) { if (endScreen) endScreen.style.display = 'none'; }
      });
    })();
  </script>
  <!-- Reset spear handlers removed -->
</body>
